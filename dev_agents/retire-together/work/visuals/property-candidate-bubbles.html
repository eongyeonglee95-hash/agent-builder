<style>
#candidate-mocks {color-scheme:light dark;font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;--paper:light-dark(#fafaf8,#161c23);--surface:light-dark(#fff,#222b35);--ink:light-dark(#19263d,#edf1f8);--sub:light-dark(#687487,#adb8ca);--line:light-dark(#e0e4eb,#394452);--soft:light-dark(#edf1f6,#2a3545);--navy:light-dark(#202d50,#34466d);color:var(--ink)}
#candidate-mocks *{box-sizing:border-box} #candidate-mocks .stage{min-height:720px;background:var(--paper);padding:24px;border-radius:18px} #candidate-mocks button{font:inherit;cursor:pointer} #candidate-mocks .top,#candidate-mocks .section-head,#candidate-mocks .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap} #candidate-mocks h2{font-size:22px;margin:0;font-weight:700} #candidate-mocks h3{font-size:20px;margin:0} #candidate-mocks small{font-size:12px;color:var(--sub)} #candidate-mocks .tabs{display:flex;gap:6px} #candidate-mocks .plain{border:0;background:transparent;color:var(--sub);padding:10px 12px;border-radius:24px} #candidate-mocks .plain.active{background:var(--soft);color:var(--ink);font-weight:600} #candidate-mocks .money{margin:20px 0;background:var(--navy);color:#fff;border-radius:16px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap} #candidate-mocks .money strong{display:block;font-size:30px;margin-top:5px} #candidate-mocks .money span{font-size:13px;color:#d8dfed} #candidate-mocks .homes{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 0 24px} #candidate-mocks .home{display:flex;justify-content:space-between;padding:16px 18px;gap:14px;font-size:15px} #candidate-mocks .home+.home{border-top:1px solid var(--line)} #candidate-mocks .home small{margin-left:10px} #candidate-mocks .action{background:var(--ink);color:var(--paper);border:0;border-radius:24px;padding:11px 16px;font-size:13px;font-weight:600} #candidate-mocks .filters{display:flex;gap:7px;margin:14px 0;align-items:center;flex-wrap:wrap} #candidate-mocks .chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:7px 13px;font-size:13px} #candidate-mocks .chip[aria-pressed=true]{background:var(--ink);color:var(--paper)} #candidate-mocks .field{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:220px;padding:16px 0} #candidate-mocks .bubble{position:relative;flex:0 0 140px;width:140px;height:140px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;padding:12px;box-shadow:0 10px 24px #16263d0a;text-align:center} #candidate-mocks .bubble strong{font-size:15px;line-height:1.35;max-width:116px} #candidate-mocks .bubble .price{font-size:20px;font-weight:700} #candidate-mocks .bubble[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)} #candidate-mocks .bubble[aria-pressed=true] small{color:#d8dfed} #candidate-mocks .badge{position:absolute;right:5px;top:5px;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;background:var(--soft);color:var(--ink);font-size:16px} #candidate-mocks .float .bubble:nth-child(even){transform:translateY(16px)} #candidate-mocks .float .bubble:nth-child(3){transform:translateY(-12px)} #candidate-mocks .groups{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:18px 0} #candidate-mocks .group{border-top:1px solid var(--line);padding-top:12px} #candidate-mocks .group h4{margin:0;font-size:13px} #candidate-mocks .group .field{gap:12px;justify-content:flex-start;min-height:170px} #candidate-mocks .compact .bubble{width:120px;height:120px;flex-basis:120px} #candidate-mocks .rail .field{justify-content:flex-start;gap:16px;min-height:190px} #candidate-mocks .rail .bubble{box-shadow:none} #candidate-mocks .foot{border-top:1px solid var(--line);padding-top:16px;margin-top:16px} #candidate-mocks .selection{font-size:13px;color:var(--sub)} #candidate-mocks .review{margin-top:20px} #candidate-mocks .saved-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:16px 0} #candidate-mocks [hidden]{display:none!important} #candidate-mocks button:focus-visible{outline:3px solid #718bc0;outline-offset:4px}
@media(max-width:600px){#candidate-mocks .stage{padding:16px;min-height:980px}#candidate-mocks .groups{grid-template-columns:1fr}#candidate-mocks .field{gap:12px}#candidate-mocks .bubble{width:126px;height:126px;flex-basis:126px}#candidate-mocks .float .bubble{transform:none!important}#candidate-mocks .home small{display:block;margin:4px 0 0}#candidate-mocks .money strong{font-size:26px}}
</style>
<div id="candidate-mocks">
<div class="viz-carousel" aria-label="우리 집 아래 AI 후보 디자인" data-previous-label="이전 시안" data-next-label="다음 시안">
<section data-variant="떠 있는 후보" class="stage float" aria-label="떠 있는 후보"></section>
<section data-variant="구별 컬렉션" class="stage compact" aria-label="구별 컬렉션" hidden></section>
<section data-variant="한 줄 후보" class="stage rail" aria-label="한 줄 후보" hidden></section>
</div>
</div>
<script>
(()=>{const root=document.getElementById('candidate-mocks');const items=[{name:'래미안대치팰리스',district:'강남',price:'38.5억',area:'84㎡'},{name:'디에이치아너힐즈',district:'강남',price:'35.8억',area:'84㎡'},{name:'래미안블레스티지',district:'강남',price:'32.4억',area:'84㎡'},{name:'반포리체',district:'서초',price:'34.2억',area:'84㎡'},{name:'래미안에스티지S',district:'서초',price:'33.6억',area:'84㎡'}];
root.querySelectorAll('.stage').forEach((stage,index)=>{const selected=new Set();let filter='전체';stage.innerHTML=`<div class="top"><h2>부동산</h2><div class="tabs"><button class="plain active own" type="button">내 부동산</button><button class="plain watch" type="button">관심 단지 <span class="count">0</span></button></div></div><div class="own-view"><div class="money"><div><span>부동산 순자산 + 보유 현금</span><strong>21억 9,000만원</strong></div><span>매도 세금·비용 차감 전</span></div><h3>우리 집</h3><div class="homes"><div class="home"><div><b>염리삼성래미안</b><small>114㎡</small></div><b>22.5억</b></div><div class="home"><div><b>힐스테이트 벤처밸리</b><small>84㎡</small></div><b>6.5억</b></div></div><div class="section-head"><h3>다음 집을 찾아볼까요</h3><small>AI 후보 · 시안용 가상 가격</small></div><div class="filters"><button class="chip" data-filter="전체" aria-pressed="true">전체</button><button class="chip" data-filter="강남" aria-pressed="false">강남</button><button class="chip" data-filter="서초" aria-pressed="false">서초</button><small>우리 집보다 높은 가격 · 20–30평대</small></div><div class="candidates"></div><div class="foot"><span class="selection" aria-live="polite">마음에 드는 후보를 선택하세요</span><button class="action go" type="button">관심 단지에서 보기 →</button></div></div><div class="review" hidden><div class="section-head"><h3>저장한 관심 단지</h3><button class="plain back" type="button">← 후보 더 고르기</button></div><div class="saved"></div><small>시안 미리보기 · 실제 관심 목록에는 저장되지 않아요</small></div>`;
const area=stage.querySelector('.candidates');function draw(){const shown=items.filter(x=>filter==='전체'||x.district===filter);const bubble=x=>{const i=items.indexOf(x);return `<button type="button" class="bubble" data-id="${i}" aria-label="${x.name} 관심 단지 선택" aria-pressed="${selected.has(i)}"><span class="badge">${selected.has(i)?'✓':'+'}</span><small>${x.district} · ${x.area}</small><strong>${x.name}</strong><span class="price">${x.price}</span></button>`};area.innerHTML=index===1?`<div class="groups">${['강남','서초'].filter(d=>filter==='전체'||d===filter).map(d=>`<div class="group"><h4>${d}구</h4><div class="field">${shown.filter(x=>x.district===d).map(bubble).join('')}</div></div>`).join('')}</div>`:`<div class="field">${shown.map(bubble).join('')}</div>`;stage.querySelector('.count').textContent=selected.size;stage.querySelector('.selection').textContent=selected.size?`${selected.size}개 선택 · 관심 단지에 모아보기`:'마음에 드는 후보를 선택하세요';}
function view(watch){stage.querySelector('.own-view').hidden=watch;stage.querySelector('.review').hidden=!watch;stage.querySelector('.own').classList.toggle('active',!watch);stage.querySelector('.watch').classList.toggle('active',watch);stage.querySelector('.saved').innerHTML=selected.size?[...selected].map(i=>`<div class="saved-row"><div><b>${items[i].name}</b><br><small>${items[i].district}구 · ${items[i].area}</small></div><b>${items[i].price}</b></div>`).join(''):'<div class="saved-row">아직 선택한 후보가 없어요.</div>';}
area.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const id=Number(b.dataset.id);selected.has(id)?selected.delete(id):selected.add(id);draw()});stage.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;stage.querySelectorAll('[data-filter]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));draw()});stage.querySelector('.go').onclick=()=>view(true);stage.querySelector('.watch').onclick=()=>view(true);stage.querySelector('.own').onclick=()=>view(false);stage.querySelector('.back').onclick=()=>view(false);draw();
if(globalThis.Tweak){const state={shadows:true};const tweak=new Tweak({container:stage,onChange:()=>{stage.querySelectorAll('.bubble').forEach(b=>b.style.boxShadow=state.shadows?'':'none')}});tweak.addToggle(state,'shadows',{label:'원형 후보 그림자'});}
});})();
</script>

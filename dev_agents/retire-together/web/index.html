<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1f1a" />
    <meta name="description" content="둘이서은퇴 — 우리의 오늘이, 더 나은 내일이 되도록. 부부의 자산과 은퇴 계획을 함께 살펴보는 가계 노트." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>둘이서은퇴 · 우리의 자산, 함께 그리는 내일</title>
    <script>/* 저장된 브랜드 테마를 첫 그리기 전에 적용해 색이 번쩍이지 않게 (src/brand-mode.ts 가 저장) */
      try { var t = JSON.parse(localStorage.getItem("rt-brand") || "null"); if (t && t.vars) for (var k in t.vars) document.documentElement.style.setProperty(k, t.vars[k]) } catch (e) {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/brand-mode.ts"></script>
  </body>
</html>

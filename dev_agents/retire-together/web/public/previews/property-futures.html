function lineChart(series,{unit='',indexed=false,height=250}={}){const colors=['#0f5c4a','#1b64da','#d397b5','#8b95a1'];const valid=series.flatMap(s=>s.values.filter(v=>v!=null));if(!valid.length)return '<p class="note">비교할 자료가 없습니다.</p>';let lo=Math.min(...valid),hi=Math.max(...valid);const span=hi-lo||1;lo-=span*.15;hi+=span*.15;const left=58,right=680,top=20,bottom=height-40;let svg=`<svg class="research-chart" viewBox="0 0 720 ${height}" role="img" aria-label="${series.map(s=>s.name).join(' 및 ')} ${indexed?'시작월을 100으로 바꾼':'관측값'} 추이"><rect x="${left}" y="${top}" width="${right-left}" height="${bottom-top}" fill="none"/>`;for(let i=0;i<4;i++){const val=lo+(hi-lo)*i/3,y=bottom-(val-lo)/(hi-lo)*(bottom-top);svg+=`<path d="M${left} ${y}H${right}" stroke="#e5e8eb"/><text x="${left-10}" y="${y+4}" text-anchor="end" fill="#6b7684" font-size="12">${indexed?val.toFixed(0):unit==='%'?val.toFixed(1):money(val)}</text>`;}series.forEach((s,k)=>{let path='';let drawing=false;s.values.forEach((v,i)=>{if(v==null){drawing=false;return}const x=left+i/(s.values.length-1)*(right-left),y=bottom-(v-lo)/(hi-lo)*(bottom-top);path+=`${drawing?'L':'M'}${x},${y} `;drawing=true;});svg+=`<path d="${path}" fill="none" stroke="${s.color||colors[k%colors.length]}" stroke-width="2.5"/>`;});const n=series[0].values.length,labels=[0,Math.floor((n-1)/2),n-1];labels.forEach(i=>{svg+=`<text x="${left+i/(n-1)*(right-left)}" y="${height-10}" text-anchor="middle" fill="#6b7684" font-size="12">${months[24-n+i]}</text>`});svg+='</svg>';return `${svg}<div class="chart-legend">${series.map((s,k)=>`<span><i style="background:${s.color||colors[k%colors.length]}"></i>${s.name}</span>`).join('')}</div>`}
function workbook(){const scope=visibleComplexes(),c=scope.find(x=>x.id===state.selected)||scope[0]||current(),stats=sampleStats(c);let list=visibleComplexes(universe.filter(x=>sampleStats(x).n>=state.minSamples));if(state.sort==='spread')list.sort((a,b)=>(sampleStats(b).askGap??-Infinity)-(sampleStats(a).askGap??-Infinity));if(state.sort==='inventory')list.sort((a,b)=>(sampleStats(b).inventory??-Infinity)-(sampleStats(a).inventory??-Infinity));const adsChange=scope.some(x=>x.ads!=null)?scope.filter(x=>x.ads!=null).reduce((n,x)=>n+x.ads-x.prevAds,0):null;return `${header('시장 · 관심 단지')}<div class="page">${marketTabs()}${watchDistrictNav()}<section class="intro"><div><div class="eyebrow">01 / A personal property terminal</div><h1>관심 단지</h1><p>자치구별 가격 · 전세 · 거래 · 매물의 흐름.</p></div><div class="terminal-stamp"><span class="dot"></span> SYNTHETIC DATASET<br><b>2026.11.07</b><small>가격 관측 24개월 · 실제 시장 아님</small></div></section><div class="quant-summary"><div><span>${state.watchDistrict==='all'?'전체 관심 지역':state.watchDistrict}</span><strong>${String(scope.length).padStart(2,'0')}<small>단지</small></strong><p>단지 + 전용면적 단위</p></div><div><span>관측 광고 변화</span><strong>${adsChange==null?'—':`${adsChange>0?'+':''}${adsChange}`}<small>건</small></strong><p>10.01 → 11.01 · 동일 예시 출처</p></div><div><span>최근 3개월 거래 표본</span><strong>${scope.reduce((n,x)=>n+sampleStats(x).n,0)}<small>건</small></strong><p>선택 층 조건 · 해제 제외</p></div><div><span>현재 호가 미확인</span><strong>${String(scope.filter(x=>x.asking==null).length).padStart(2,'0')}<small>단지</small></strong><p>미확인은 0으로 채우지 않음</p></div></div><div class="panel-head quant-toolbar"><div class="tabs"><button data-mode="factors" aria-pressed="${state.mode==='factors'}">팩터 관측표</button><button data-mode="history" aria-pressed="${state.mode==='history'}">월별 추적표</button></div><div class="row wrap"><label>표본 <select id="sample-filter"><option value="0" ${state.minSamples===0?'selected':''}>전체</option><option value="10" ${state.minSamples===10?'selected':''}>3개월 10건 이상</option></select></label><label>구 안에서 정렬 <select id="factor-sort"><option value="name" ${state.sort==='name'?'selected':''}>관심 순서</option><option value="spread" ${state.sort==='spread'?'selected':''}>호가 괴리</option><option value="inventory" ${state.sort==='inventory'?'selected':''}>광고 증감</option></select></label></div></div>${comparisonTray()}${state.mode==='factors'?`<div class="quant-table-wrap"><table class="watch-table quant-table"><thead><tr><th>자치구 / 단지 / 평형</th><th>3개월 거래 중위값</th><th>이전 3개월 대비</th><th>현재 관찰 호가</th><th>호가 괴리</th><th>전세가율</th><th>관측 광고 변화</th><th>10월 거래</th><th>24개월 호가</th></tr></thead><tbody>${districtGroups(list).map(g=>workbookGroupRow(g,9,'factor')+g.items.map(x=>{const s=sampleStats(x);return `<tr data-complex="${x.id}" class="${x.id===state.selected?'selected':''}"><td><div class="workbook-name">${compareInput(x,'factor')}<button class="name-button" data-select="${x.id}">${x.name}<small>${x.area}㎡ · ${x.year}년 · ${x.units}세대</small></button></div></td><td><button data-evidence="${x.id}" data-kind="trades">${money(s.value)}<small>n=${s.n} · 8~10월</small></button></td><td class="${s.momentum>=0?'market-up':'market-down'}">${pct(s.momentum)}<small>표본 구성 변화 포함</small></td><td><button data-evidence="${x.id}" data-kind="listings">${money(x.asking)}<small>${x.asking?'11.01 관찰':'출처 미확인'}</small></button></td><td>${pct(s.askGap)}<small>호가 / 거래 − 1</small></td><td>${s.leaseRatio.toFixed(1)}%<small>전세 / 매매 관찰가</small></td><td>${pct(s.inventory)}<small>${x.ads==null?'수집 미확인':`${x.prevAds} → ${x.ads}건`}</small></td><td>${s.monthN}<small>선택 조건 표본</small></td><td>${spark(x.sale)}</td></tr>`}).join('')).join('')}${!list.length?'<tr><td colspan="9" class="workbook-empty">이 구에서 현재 표본 조건에 맞는 관심 단지가 없습니다.</td></tr>':''}</tbody></table></div>`:historyGrid(list)}<div class="quant-bottom"><section class="obs-brief"><div><span class="eyebrow">SELECTED RESEARCH QUESTION</span><h3 style="margin:12px 0">${c.name}</h3><p class="research-question">${c.focus} function historyGrid(list){return `<section class="history-panel"><div class="row between wrap" style="margin:14px 0"><div class="tabs">${Object.entries(metricName).map(([key,label])=>`<button data-metric="${key}" aria-pressed="${state.metric===key}">${label}</button>`).join('')}</div><span class="note">매월 같은 관찰 기준 · 공급 평당 / 전용㎡ 구분</span></div><div class="quant-table-wrap"><table class="watch-table history-table"><thead><tr><th>자치구 / 단지 / 면적</th>${months.slice(-8).map(m=>`<th>${m}</th>`).join('')}<th>전월 변화</th></tr></thead><tbody>${districtGroups(list).map(g=>workbookGroupRow(g,10,'history')+g.items.map(c=>`<tr data-complex="${c.id}"><td><div class="workbook-name">${compareInput(c,'history')}<button class="name-button" data-select="${c.id}">${c.name}<small>${c.py}평형 · 전용 ${c.area}㎡</small></button></div></td>${months.slice(-8).map((_,k)=>{const i=k+16,n=metricValue(c,i),d=change(n,metricValue(c,i-1));return `<td class="heat ${d>0?'rise':'fall'}" style="--heat:${Math.min(.22,Math.abs(d)/5)}"><button data-history="${c.id}:${i}">${metricFormat(n)}</button></td>`}).join('')}<td>${state.metric==='ratio'?`${(metricValue(c,23)-metricValue(c,22)).toFixed(1)}%p`:pct(change(metricValue(c,23),metricValue(c,22)))}</td></tr>`).join('')).join('')}${!list.length?'<tr><td colspan="10" class="workbook-empty">이 구에서 현재 표본 조건에 맞는 관심 단지가 없습니다.</td></tr>':''}</tbody></table></div><p class="note" style="margin-top:12px">셀을 누르면 해당 월의 매매가·평당가·전세가·전세가율·매전갭과 원자료 구분을 볼 수 있어요. 이 표의 가격은 가상 월별 관찰가입니다.</p></section>`}
function scatter(c,rows){const all=observedRows(c,18,23,'all'),lo=Math.min(...all.map(r=>r.price))-30,hi=Math.max(...all.map(r=>r.price))+30;let svg='<svg class="scatter-chart" viewBox="0 0 720 270" role="img" aria-label="계약월별 거래 가격과 층 분포">';for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3,y=220-i/3*190;svg+=`<path d="M58 ${y}H680" stroke="#e5e8eb"/><text x="48" y="${y+4}" text-anchor="end" font-size="12" fill="#6b7684">${money(v)}</text>`;}for(let m=18;m<24;m++)svg+=`<text x="${80+(m-18)/5*560}" y="250" text-anchor="middle" font-size="12" fill="#6b7684">${months[m]}</text>`;for(const r of rows){const x=80+(r.i-18)/5*560+(Number(r.date.slice(-2))-12)*1.6,y=220-(r.price-lo)/(hi-lo)*190;svg+=`<circle cx="${x}" cy="${y}" r="6" fill="${r.floor<6?'#d397b5':r.floor>20?'#1b64da':'#0f5c4a'}" opacity=".8" role="button" tabindex="0" data-trade="${r.id}" aria-label="${r.date} ${r.floor}층 ${money(r.price)}"><title>${r.date} · ${r.floor}층 · ${money(r.price)}</title></circle>`;}return `${svg}</svg><div class="chart-legend"><span><i style="background:#d397b5"></i>1~5층</span><span><i style="background:#0f5c4a"></i>6~20층</span><span><i style="background:#1b64da"></i>21층 이상</span></div>`;}

function journal(){const weekly=state.frequency==='week',c=current(),r=reportStats(universe[2]);return `${header('리서치 저널')}<div class="page"><div class="journal-header"><div><div class="eyebrow muted" style="margin-bottom:9px">03 / A research journal that remembers</div><h1 class="serif">관찰의 밀도</h1></div><button class="btn" data-action="export">${icon('download')}리포트 원문</button></div><div class="journal-layout"><aside class="archive-nav"><span class="eyebrow">RESEARCH LOG</span><button data-frequency="month" aria-pressed="${!weekly}"><span>10월 월간호</span><span>↗</span></button><button data-frequency="week" aria-pressed="${weekly}"><span>11월 1주 관측</span><span>↗</span></button></aside><article><section class="issue-main"><div><div class="row between"><span class="eyebrow">${weekly?'WEEKLY OBSERVATIONS':'MONTHLY RESEARCH'} · AI 리포트 형식 예시</span><span class="issue-number">${weekly?'W1':'10'}</span></div><h2 class="serif">${weekly?'이번 주의 새 정보,<br>이전 기록과 연결하다.':'가격의 방향보다,<br>엇갈린 지표에 주목하다.'}</h2><p class="issue-lead">${weekly?'이번 주에는 새로운 관측과 수정 사항을 모읍니다. 한 주의 적은 거래를 가격 추세로 확대하지 않고, 호가 변경·늦은 신고·공공 문서·임장 답변을 이전 기록과 대조합니다.':'월별 매매·전세 관찰가를 비교하고, 거래 표본과 매물 광고의 변화를 따로 확인합니다. 서로 다른 지표가 같은 이야기를 하는지, 어느 지점에서 어긋나는지가 이번 보고서의 질문입니다.'}<button class="source-ref" data-action="dictionary" aria-label="분석 기준과 지표 정의">1</button></p><p class="note" style="margin-top:18px">${weekly?'관측 기간 11.01—11.07':'관찰 기간 10.01—10.31 · 발행 기준 11.01'}<br>가상 자료로 만든 보고서 형식 · 실모델 생성 아님</p></div><aside class="report-callout"><span class="eyebrow">QUESTION OF THE PERIOD</span><h3 style="margin-top:14px">${c.name}</h3><p class="big" style="font-size:var(--xl)">${c.focus}</p><p>매매 관찰가 ${pct(change(c.sale[23],c.sale[22]))}<br>전세 관찰가 ${pct(change(c.rent[23],c.rent[22]))}<br>공통 관찰월 · 9월 → 10월</p><button class="btn text" style="color:inherit;justify-content:flex-start" data-evidence="${c.id}" data-kind="history">원자료로 이동 ${icon('arrow')}</button></aside></section>${journalMarketContext()}<section class="journal-section"><div class="panel-head"><h3>01. ${weekly?'이번 주 바뀐 자료':'이번 달의 교차 관측'}</h3>${pill(weekly?'새 관측 중심':'같은 월 기준','gray')}</div>${weekly?`<div class="weekly-events">${signals.map(s=>`<button class="weekly-event" data-case="${s.id}"><time>${s.date}</time><span>${pill(s.kind,'gray')}<b>${s.title}</b></span><span>↗</span></button>`).join('')}</div>`:`<div class="report-scroll"><table class="report-table"><thead><tr><th>단지</th><th>매매 변화</th><th>전세 변화</th><th>전세가율</th><th>관측 광고</th><th>근거</th></tr></thead><tbody>${universe.map(x=>`<tr><td><b>${x.name}</b><small class="muted"> · ${x.area}㎡</small></td><td>${pct(change(x.sale[23],x.sale[22]))}</td><td>${pct(change(x.rent[23],x.rent[22]))}</td><td>${(x.rent[23]/x.sale[23]*100).toFixed(1)}%</td><td>${pct(change(x.ads,x.prevAds))}</td><td><button class="source-ref" data-evidence="${x.id}" data-kind="history" aria-label="${x.name} 근거">↗</button></td></tr>`).join('')}</tbody></table></div>`}</section><section class="journal-section"><div class="panel-head wrap"><div><h3>02. 그때 알았던 것과 지금 아는 것</h3><p class="note" style="margin-top:8px">마포 파크센트럴 · 8~10월 거래 표본 · 전체 층 · 해제 제외</p></div><div class="tabs"><button data-asof="published" aria-pressed="${state.asof==='published'}">11.01 발행 당시</button><button data-asof="latest" aria-pressed="${state.asof==='latest'}">11.07 최신 반영</button></div></div><div class="revision-panel"><div><span class="note">계산에 포함한 거래</span><strong>${r.n}<small>건</small></strong></div><div><span class="note">표본 중위값</span><strong>${money(r.value)}</strong></div><p>${state.asof==='published'?'발행 시점에 확인한 자료만 사용했습니다. 이후 관측된 과거 계약은 이 발행본에 소급해서 넣지 않습니다.':'10월 28일 계약 1건이 11월 5일 처음 관측된 합성 사례를 추가했습니다. 이전 발행본은 보존하고 어떤 자료가 늘었는지 기록합니다.'}<button class="source-ref" data-action="revision" aria-label="뒤늦게 반영된 거래 기록">2</button></p></div></section><section class="journal-section report-columns"><div><h3>03. 해석과 반대 근거</h3><div class="story-item"><div class="story-tag">호가와 실거래</div><b>호가 괴리의 크기만으로 가격을 판단하지 않기</b><p>같은 평형이어도 층·향·수리 상태·입주 조건이 다릅니다. 관측 광고의 구성이 바뀌었는지 거래 원표와 함께 확인합니다.<button class="source-ref" data-evidence="B" data-kind="listings" aria-label="매물 이력 근거">3</button></p></div><div class="story-item"><div class="story-tag">공공 문서와 현장 정보</div><b>발표·전언·확정된 사실을 나누기</b><p>사업 발표와 실제 단계 진전, 예산 편성과 집행을 구분합니다. 전화임장 답변은 날짜와 전제 조건을 남기고 공식 자료와 대조합니다.<button class="source-ref" data-case="permit" aria-label="공공 문서 검토 사례">4</button></p></div></div><div><h3>04. 다음 관측으로 이어갈 질문</h3>${signals.map(s=>`<label class="task-item"><input type="checkbox" data-task="${s.id}" ${state.tasks[s.id]?'checked':''}><span>${s.next}<small>${state.tasks[s.id]?'다음 보고서에서 다시 확인하도록 표시':'단지 근거 노트와 연결된 연구 질문'}</small></span></label>`).join('')}<div class="report-notes" style="margin-top:20px"><label class="range-label" for="report-note">내 해석과 다음 질문</label><textarea id="report-note" placeholder="어떤 근거를 더 확인하면 내 판단이 달라질까요?">${esc(state.notes)}</textarea><p class="note">현재 아티팩트 안에서 유지되는 메모입니다.</p></div></div></section><div class="journal-footer"><span>관심 단지 · 관측값 · 계산 조건 · 원문 근거 · 질문</span><span>매수 시점·투자 점수·세금 계산은 이 보고서의 목적이 아닙니다.</span></div></article></div></div>${caption('03','주간·월간 저널','관측 시점과 근거를 보존하는 연구의 기억')}`;}
function shell(title,subtitle,body){return `<div class="dialog-head"><div><div class="eyebrow muted" style="margin-bottom:8px">EVIDENCE / NOT AN INVESTMENT SIGNAL</div><h2 id="dialog-title">${title}</h2><p class="note" style="margin-top:10px">${subtitle}</p></div><button class="close-button" data-action="close" aria-label="닫기">×</button></div><div class="dialog-body">${body}</div>`;}
function show(html){$('#dialog-content').innerHTML=html;if(!$('#detail').open)$('#detail').showModal();}
function evidence(c,kind='history',month=23){let body='';if(kind==='history'){body=`<div class="evidence-grid"><section><h3>${months[month]} 월별 관찰</h3>${Object.entries(metricName).map(([k,label])=>`<div class="evidence-row"><span>${label}</span><b>${metricFormat(metricValue(c,month,k),k)}</b></div>`).join('')}</section><section class="source-item"><span class="data-badge">스크린샷의 구조를 확장한 예시</span><p>${c.region} · ${c.py}평형 / 전용 ${c.area}㎡<br>${c.year}년 · ${c.units}세대<br>${c.structure}</p><p>관찰가와 실거래는 다른 계열입니다. 평당가는 공급 ${c.py}평 기준이며 전용㎡당 가격과 혼용하지 않습니다.</p><p class="note">모든 값은 합성 예시입니다. 사용자가 보낸 시트의 실제 가격은 가져오지 않았습니다.</p></section></div>`;}
 if(kind==='trades'){const rows=observedRows(c,21,23);body=`<div class="row between wrap"><h3>계산에 사용한 거래 ${rows.length}건</h3>${pill(state.floor==='all'?'전체 층':'6~20층만','gray')}</div><p class="note" style="margin-top:10px">전용 ${c.area}㎡ · 2026.08~10 · 해제 제외 · 가격 단위 억원</p><div class="report-scroll"><table class="report-table"><thead><tr><th>계약일</th><th>층</th><th>금액</th><th>거래 유형</th><th>최초 관측일</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.date}</td><td>${r.floor}</td><td>${money(r.price)}</td><td>${r.type}</td><td>${r.observed}</td></tr>`).join('')}</tbody></table></div><p class="note" style="margin-top:16px">최초 관측일은 우리 시스템이 처음 본 날입니다. 실제 신고일과 동일하다고 가정하지 않습니다. 전용면적과 층을 맞춰도 다른 품질 차이는 남습니다.</p>`;}
 if(kind==='listings'){body=c.asking==null?'<div class="card"><h3>이 출처의 현재 호가는 미확인입니다.</h3><p style="margin-top:14px">확인된 과거 관찰가는 남기고 현재값은 비워 둡니다. 수집 실패와 시장에 매물이 없는 상태를 구분합니다.</p></div>':`<div class="evidence-grid"><section><h3>같은 매물을 계속 관찰하기</h3>${[['L01',c.asking,c.asking+10,'중층 · 남향','중개사 A/B 광고 묶음 후보'],['L02',c.asking+45,c.asking+45,'고층 · 남동향','입주 시점 확인 필요'],['L03',null,c.asking-15,'저층 · 남서향','광고 노출 종료 · 매매 여부 미확인']].map(([id,now,prev,cond,note])=>`<div class="source-item" style="margin:12px 0"><div class="row between"><b>${id} · ${cond}</b>${pill(now==null?'노출 종료':now!==prev?'호가 수정':'유지','gray')}</div><p>이전 ${money(prev)} → 현재 ${money(now)}</p><small class="muted">${note}</small></div>`).join('')}</section><section><h3>광고 수와 집의 수는 다릅니다</h3><div class="insight-box" style="margin-top:16px">관측 광고 ${c.prevAds} → ${c.ads}건<br>출처별 광고 ID 중복 제거와 실제 같은 집 식별은 별도입니다.</div><p style="margin-top:20px">가격 변경·재노출·노출 종료를 각각 기록합니다. 광고가 사라졌다는 이유로 거래 완료나 매도 속도를 계산하지 않습니다.</p><button class="btn" data-evidence="${c.id}" data-kind="field" style="margin-top:20px">전화·매물 임장으로 대조 ↗</button></section></div>`;}
 if(kind==='field'){body=`<div class="evidence-grid"><section><h3>전화임장 기록 · 가상 예시</h3><div class="source-item"><div class="row between"><b>11.07 · 중개사 A</b>${pill('전언','gray')}</div><p>“광고 두 개가 같은 집일 수 있고, 입주일은 조정 가능하다고 들었습니다.”</p><small class="muted">기능 예시로 작성한 문장 · 실제 상담 아님</small></div><div class="evidence-row"><span>확인할 질문</span><b>동·층·향 일치 여부</b></div><div class="evidence-row"><span>근거 대조</span><b>광고 L01 / L04</b></div></section><section><h3>매물임장 체크</h3>${[['field-light','채광·조망 직접 관찰'],['field-date','입주 가능일 서면 확인'],['field-repair','수리 상태와 추가 비용 메모'],['field-noise','출퇴근 시간대 소음 확인']].map(([id,label])=>`<label class="task-item"><input type="checkbox" data-task="${c.id}-${id}" ${state.tasks[`${c.id}-${id}`]?'checked':''}><span>${label}</span></label>`).join('')}<p class="note" style="margin-top:15px">주관적 경험·중개사 전언·문서 확인을 구분합니다. 기록은 해당 단지와 매물에 연결합니다.</p></section></div>`;}
 if(kind==='research'){body=researchInline(c)+`<button class="btn" data-evidence="${c.id}" data-kind="field" style="margin-top:20px">전화·매물 임장 기록 ↗</button>`;}
 show(shell(`${c.name} · 원자료 노트`,`단지 + 전용 ${c.area}㎡ · 날짜·조건·출처가 있는 관측 기록`,`<div class="tabs">${[['history','월별 시세'],['trades','실거래 원표'],['listings','매물 이력'],['field','전화·매물 임장'],['research','근거·질문']].map(([k,label])=>`<button data-evidence="${c.id}" data-kind="${k}" aria-pressed="${kind===k}">${label}</button>`).join('')}</div>${body}`));}
const definitions=[['월별 관찰가','동일 출처·같은 가격 기준으로 매월 기록한 값. 현재 예시는 매매·전세 관찰가이며 실거래 통계와 분리합니다.'],['거래 중위값','선택한 기간·면적·층 조건의 해제 제외 거래 가격 중앙값. 거래된 주택의 구성에 영향을 받으며 가격지수가 아닙니다.'],['3개월 변화','최근 3개월 거래 중위값 ÷ 직전 3개월 거래 중위값 − 1. 가격이 아니라 표본 구성 변화일 수도 있습니다.'],['호가 괴리','현재 관찰 호가 ÷ 최근 3개월 거래 중위값 − 1. 같은 집의 협상 할인율·고평가 점수가 아닙니다.'],['전세가율 · 매전갭','같은 월·같은 기준 전세 관찰가 ÷ 매매 관찰가. 매전갭은 매매 − 전세. 실제 보증금 인수액은 개별 계약에서 따로 확인합니다.'],['공급 평당가','매매 관찰가 ÷ 공급 평형. 전용㎡당 가격은 다른 분모이므로 두 지표를 혼용하지 않습니다.'],['가격 비율의 백분위','두 단지 가격 비율의 24개월 관측 중 현재 비율 이하의 비중. 비교군·기간을 바꾸면 달라지며 적정가 판단이 아닙니다.'],['관측 광고 변화','동일 출처에서 관찰한 광고 수의 증감. 실제 서로 다른 매물 수·시장 전체 재고·매매 완료 건수가 아닙니다.'],['거래 회전율 · 확장 지표','기간 거래 건수 ÷ 단지 세대수. 연율·집계기간·지분 거래 제외 여부를 명시한 뒤 후속 추가할 지표입니다.'],['관측 시점','계약일, 처음 관측한 날짜, 발행 기준일, 수정일을 별도 보관. 과거 보고서는 당시 이용 가능했던 정보로 재현합니다.']];

const compareColors={A:'#176957',B:'#3273bf',C:'#af6382',D:'#a0793d',E:'#785ca1',F:'#487e8a'};
function compareInput(c,where){return `<input type="checkbox" id="compare-${where}-${c.id}" data-compare="${c.id}" aria-label="${c.name} 비교 선택" ${state.compare.includes(c.id)?'checked':''}>`;}
function comparisonTray(){return `<div class="comparison-tray"><div><b>비교함 <span>${state.compare.length}</span></b>${state.compare.length?`<div class="grouped-basket">${groupedSelection()}</div>`:'<p>각 구 아래에서 비교할 단지를 체크하세요.</p>'}</div><button class="btn primary" data-view="relative">선택한 단지 비교 ${icon('arrow')}</button></div>`;}
function comparisonPicker(){return `<section class="comparison-picker"><div class="desk-title-row"><div><span class="eyebrow muted">WATCHLIST / COMPARE</span><h1>단지 비교</h1><p>선택한 단지의 가격과 거래를 같은 기준으로.</p></div><div class="row"><button class="btn text" data-action="compare-all">전체 선택</button><button class="btn text" data-action="compare-clear">선택 비우기</button></div></div>${comparisonDistrictSummary()}</section>`;}
function normalizeComparison(){state.compare=districtOrdered(universe.filter(c=>state.compare.includes(c.id))).map(c=>c.id);if(!state.compare.includes(state.benchmark))state.benchmark=state.compare[0]||null;if(state.compare.length&&!state.compare.includes(state.selected))state.selected=state.compare[0];}
function relative(){normalizeComparison();const chosen=districtOrdered(universe.filter(c=>state.compare.includes(c.id))),c=current(),n=state.period,key=state.compareMetric,baseline=universe.find(x=>x.id===state.benchmark),rows=observedRows(c,18,23),all=observedRows(c,18,23,'all');
 const series=chosen.map(x=>{const raw=x.sale.map((_,i)=>metricValue(x,i,key)).slice(-n),base=baseline?.sale.map((_,i)=>metricValue(baseline,i,key)).slice(-n);return {name:x.name,color:compareColors[x.id],values:state.chart==='indexed'?raw.map(v=>v/raw[0]*100):state.chart==='ratio'?raw.map((v,i)=>v/base[i]*100):raw};});
 return `${header('여러 단지 비교')}<div class="page">${watchDistrictNav()}<section class="intro"><div><div class="eyebrow">02 / COMPARE YOUR WATCHLIST</div><h1>선택한 단지를,<br>한 번에 같은 시간 위에.</h1><p>관심 단지를 체크해 가격·전세·매전갭의 흐름을 겹쳐 보세요.<br>어디가 다른지 찾고, 그 차이를 만든 근거까지 살펴봅니다.</p></div>${pill('가상 시계열 · 면적·입지 차이 보정 전')}</section>${comparisonPicker()}
 ${!chosen.length?`<section class="card comparison-empty"><span class="eyebrow muted">YOUR COMPARISON STARTS HERE</span><h2>같이 보고 싶은 단지를 선택해 주세요.</h2><p>체크한 단지가 차트와 비교표에 함께 표시됩니다.<br>워크북에서 담아 둔 비교함과도 연결됩니다.</p></section>`:`<section class="card multi-chart-panel"><div class="panel-head"><div><span class="eyebrow muted">${chosen.length} COMPLEXES / ONE TIMELINE</span><h2>${metricName[key]} 비교</h2><p class="note">${months[24-n]}~${months[23]} · 같은 관찰월 · 실제 실거래 지수가 아닌 합성 관찰가</p></div><div class="tabs">${[12,24].map(v=>`<button data-period="${v}" aria-pressed="${n===v}">${v}개월</button>`).join('')}</div></div><div class="comparison-chart-controls"><div class="tabs">${[['sale','매매'],['rent','전세'],['ratio','전세가율'],['gap','매전갭'],['per','평당가']].map(([k,t])=>`<button data-compare-metric="${k}" aria-pressed="${key===k}">${t}</button>`).join('')}</div><div class="tabs"><button data-chart="indexed" aria-pressed="${state.chart==='indexed'}">시작월 = 100</button><button data-chart="raw" aria-pressed="${state.chart==='raw'}">원래 값</button><button data-chart="ratio" aria-pressed="${state.chart==='ratio'}">기준 단지 = 100</button></div></div>${state.chart==='ratio'?`<div class="benchmark-line"><label>기준 단지 <select id="benchmark-select">${chosen.map(x=>`<option value="${x.id}" ${x.id===state.benchmark?'selected':''}>${x.name}</option>`).join('')}</select></label><p>각 월의 선택 지표 ÷ 같은 월의 기준 단지 지표 × 100. 100보다 크면 기준 단지보다 값이 큽니다.</p></div>`:''}${lineChart(series,{indexed:state.chart!=='raw',unit:state.chart==='raw'&&key==='ratio'?'%':'' ,height:290})}<p class="note">선택한 단지의 면적·연식·층·입지 차이는 남아 있습니다. 시작월 100은 변화의 크기, 기준 단지 100은 같은 시점의 상대적인 수준을 보여줍니다.</p></section>
 <section class="card comparison-matrix-panel"><div class="panel-head"><div><span class="eyebrow muted">SIDE BY SIDE</span><h2>다른 점을, 나란히.</h2></div><span class="note">2026.10 월별 관찰 · 실거래는 8~10월 표본</span></div><div class="report-scroll"><table class="comparison-matrix"><thead><tr class="comparison-district-band"><th>자치구</th>${districtGroups(chosen).map(g=>`<th colspan="${g.items.length}">${g.name}<small>${g.items.length}개 단지</small></th>`).join('')}</tr><tr class="complex-head"><th>비교 항목</th>${chosen.map(x=>`<th style="--series:${compareColors[x.id]}"><button data-detail="${x.id}"><i></i>${x.name}<small>${districtOf[x.id]} · 상세 분석 ↓</small></button></th>`).join('')}</tr></thead><tbody>${[
 ['전용면적 / 공급평형',x=>`${x.area}㎡ / ${x.py}평`],['연식 / 세대수',x=>`${x.year}년 / ${counts(x.units)}세대`],['매매 관찰가',x=>money(x.sale[23])],['전세 관찰가',x=>money(x.rent[23])],['전세가율',x=>`${(x.rent[23]/x.sale[23]*100).toFixed(1)}%`],['매전갭',x=>money(x.sale[23]-x.rent[23])],[`${n}개월 창 매매 변화`,x=>pct(change(x.sale[23],x.sale[24-n]))],['실거래 중위값',x=>`${money(sampleStats(x).value)} <small>n=${sampleStats(x).n} · ${state.floor==='all'?'전체 층':'6~20층'}</small>`],['현재 관찰 호가',x=>money(x.asking)],['관측 광고 증감',x=>`${pct(sampleStats(x).inventory)} <small>${x.ads==null?'출처 미확인':`${x.prevAds} → ${x.ads}건`}</small>`]
 ].map(([title,fn])=>`<tr><th>${title}</th>${chosen.map(x=>`<td>${fn(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
 <section class="card distribution-panel" id="complex-detail"><div class="panel-head"><div><span class="eyebrow muted">GO DEEPER / SELECTED COMPLEX</span><h2>${c.name} · 거래와 근거</h2></div><div class="tabs">${chosen.map(x=>`<button data-detail="${x.id}" aria-pressed="${c.id===x.id}">${x.name}</button>`).join('')}</div></div><div class="row between wrap detail-controls"><span class="note">최근 6개월 · 전용 ${c.area}㎡ · 해제 제외</span><div class="tabs"><button data-floor="all" aria-pressed="${state.floor==='all'}">전체 층</button><button data-floor="middle" aria-pressed="${state.floor==='middle'}">6~20층만</button></div></div><div class="distribution-grid"><div>${scatter(c,rows)}<p class="note">점을 누르면 계약일·층·거래 금액·최초 관측일 확인</p></div><aside><span class="eyebrow muted">OBSERVED SAMPLE</span><strong class="sample-number">${rows.length}<small>건</small></strong><p class="note">전체 층 ${all.length}건 중 현재 조건 ${rows.length}건</p><div class="evidence-row"><span>표본 중위값</span><b>${money(median(rows.map(r=>r.price)))}</b></div><button class="btn" data-evidence="${c.id}" data-kind="trades">실거래 원표 ↗</button><button class="btn" data-evidence="${c.id}" data-kind="listings">매물 이력 ↗</button><button class="btn" data-evidence="${c.id}" data-kind="field">전화·매물 임장 ↗</button></aside></div>${researchInline(c)}</section>`}
 </div>${caption('02','여러 단지 비교','체크한 단지의 가격·전세·거래·근거를 같은 화면에')}`;
}
function researchInline(c){const notes=signals.filter(s=>s.candidate===c.id);return `<section class="integrated-research"><div class="row between wrap"><div><span class="eyebrow muted">EVIDENCE & QUESTIONS</span><h3>이 단지에서 더 확인할 것</h3></div><button class="btn text" data-evidence="${c.id}" data-kind="research">근거 노트 모두 보기 ↗</button></div>${notes.length?notes.map(s=>`<button class="integrated-note" data-case="${s.id}"><span>${s.kind} · ${s.date}</span><b>${s.title}</b><span>${icon('arrow')}</span></button>`).join(''):'<p class="note">아직 연결된 공공 사건은 없습니다. 전화·매물 임장에 확인한 내용을 남기는 구조입니다.</p>'}</section>`;}
function researchNote(id){state.case=id;const s=signals.find(x=>x.id===id);select(s.candidate);show(shell(`${universe.find(c=>c.id===s.candidate).name} · 근거 노트`,'단지 상세와 주간·월간 리포트에 연결된 합성 연구 사례입니다.',`<article class="integrated-story"><span class="data-badge">${s.kind} · ${s.date}</span><h2>${s.title}</h2><p class="intel-lead">${s.lead}</p><div class="source-chain">${s.sources.map(([id,title,date,type],i)=>`<button data-signal-source="${i}"><span class="source-id">${id}</span><b>${title}</b><small>${date}</small>${pill(type,'gray')}</button>`).join('')}</div><div class="research-separation"><section><span class="research-label">01 관측한 사실</span>${s.facts.map((f,i)=>`<p><span>${i+1}</span>${f}</p>`).join('')}</section><section><span class="research-label">02 검토할 가설</span><p>${s.hypothesis}</p></section><section><span class="research-label">03 반대 근거와 빈칸</span><p>${s.counter}</p></section></div><div class="followup-box"><div><span class="eyebrow">NEXT OBSERVATION</span><p>${s.next}</p></div><label><input type="checkbox" data-task="${s.id}" ${state.tasks[s.id]?'checked':''}>다음 리포트에서 확인</label></div><button class="btn" data-evidence="${s.candidate}" data-kind="field" style="margin-top:20px">전화·임장 기록 ↗</button></article>`));}

render();
</script>
</body>
</html>

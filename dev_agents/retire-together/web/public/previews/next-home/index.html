<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다음 집 후보 · 디자인 3안</title><link rel="stylesheet" href="../property-observatory/theme-tokens.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--page-bg);color:var(--foreground);font:14px/1.5 'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:var(--background);color:var(--foreground);border-radius:8px;padding:9px 14px}button:hover{border-color:var(--primary)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:3px}button[aria-pressed=true],.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}header{background:var(--background);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}header small{color:var(--muted-foreground)}nav{display:flex;gap:6px}main{max-width:1440px;margin:auto;padding:28px 32px 100px}.context{display:flex;gap:22px;align-items:center;padding:16px 0 22px;border-bottom:1px solid var(--border);color:var(--muted-foreground)}.context strong{color:var(--foreground)}.context .money{margin-left:auto;font-size:20px;color:var(--primary);font-weight:700}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:26px 0 18px}h1{font-size:28px;letter-spacing:-1px;margin:0}h2{font-size:18px;margin:0}p{margin:5px 0;color:var(--muted-foreground)}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.filters span{border-left:1px solid var(--border);padding-left:14px;margin-left:6px}.filters .edit{margin-left:auto}.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.group-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.group-head small{color:var(--muted-foreground)}.card{background:var(--background);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;position:relative}.card.selected{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.card h3{font-size:17px;margin:0}.meta{font-size:13px;color:var(--muted-foreground);margin-top:6px}.price{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 8px}.price strong{font-size:26px;letter-spacing:-.8px}.price small{color:var(--muted-foreground)}.price b{color:var(--primary)}.card .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:12px;margin-top:12px}.link{border:0;padding:3px 0;background:none;color:var(--muted-foreground)}input[type=checkbox]{width:19px;height:19px;accent-color:var(--primary);cursor:pointer}.badge{font-size:12px;color:var(--primary);background:var(--brand-tint);padding:3px 8px;border-radius:4px;display:inline-block;margin-bottom:10px}.select-label{display:flex;align-items:center;gap:5px}.dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--brand-dark);color:var(--primary-foreground);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:24px;box-shadow:0 6px 24px #0002;z-index:5}.dock[hidden]{display:none}.dock button{background:var(--background);color:var(--foreground)}.map-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:22px}.map{height:570px;position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--grey-100)}.map svg{width:100%;height:100%}.map-label{position:absolute;top:14px;left:14px;background:var(--background);padding:6px 12px;border-radius:6px;color:var(--muted-foreground);font-size:12px}.pin{position:absolute;border-radius:20px;padding:8px 13px;font-weight:650;box-shadow:0 2px 8px #0001}.map-title{position:absolute;color:var(--grey-500);font-size:24px;font-weight:700}.table-wrap{overflow:auto;background:var(--background);border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{font-size:12px;color:var(--muted-foreground);background:var(--grey-50);font-weight:500}th,td{padding:16px;border-bottom:1px solid var(--border)}td strong{font-size:16px}td small{display:block;color:var(--muted-foreground)}tr.selected{background:var(--brand-tint)}.bar{display:flex;align-items:center;gap:8px;width:180px}.bar i{display:block;height:6px;background:var(--primary);border-radius:3px}.notes{font-size:12px;margin-top:16px}.empty{padding:40px;text-align:center}dialog{border:1px solid var(--border);border-radius:16px;width:min(480px,90vw);padding:24px;color:var(--foreground)}dialog::backdrop{background:#0004}dialog label{display:grid;gap:7px;margin-top:16px}dialog input,dialog select{border:1px solid var(--input);padding:10px;border-radius:7px;width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.fact{padding:14px 0;border-bottom:1px solid var(--border)}.notice{color:var(--primary);font-weight:600;min-height:24px} @media(max-width:900px){.groups{grid-template-columns:1fr}.map-layout{grid-template-columns:1fr}.map{height:380px}header{align-items:flex-start;flex-direction:column}main{padding:16px 16px 110px}.context{flex-wrap:wrap;gap:8px 16px}.context .money{margin-left:0}.heading{align-items:flex-start}h1{font-size:24px}.filters .edit{margin-left:0}.dock{width:calc(100% - 24px);justify-content:space-between;gap:8px}.heading p{font-size:12px}}
</style><header><div><strong>둘이서 은퇴 · 다음 집 후보</strong><br><small>디자인 시안 · 모든 가격·단지 수치는 가상 예시</small></div><nav aria-label="디자인 시안"><button data-view="a" aria-pressed="true">A · 구별 탐색</button><button data-view="b" aria-pressed="false">B · 지도 탐색</button><button data-view="c" aria-pressed="false">C · 가격 비교</button></nav></header><main><div class="context"><strong>우리 집</strong><span>염리삼성래미안 · 힐스테이트 벤처밸리</span><span class="money">가용 자금 21.9억</span><small>시안 가정 · 세금·비용 별도</small></div><div class="heading"><div><h1>다음 집을 골라보세요</h1><p id="subtitle">구별로 살펴보고, 마음에 드는 단지는 함께 담아요.</p></div><button class="primary" id="refresh">새 후보 조사</button></div><div class="filters"><button data-district="전체" aria-pressed="true">전체</button><button data-district="강남구">강남구</button><button data-district="서초구">서초구</button><button data-district="송파구">송파구</button><span>20·30평대</span><span id="range">24–36억</span><button class="edit" id="conditions">조건 수정</button></div><div class="notice" role="status" id="notice"></div><div id="content"></div><p class="notes">시안용 가상 후보입니다. 실제 추천에서는 가격 기준일·출처와 저평가 판단 근거를 함께 표시합니다.</p></main><div class="dock" hidden><strong id="count"></strong><span>여러 단지를 한 번에</span><button id="add">관심 단지에 담기 →</button></div><dialog id="settings"><form method="dialog"><h2>후보 탐색 조건</h2><p>보유 자금과 소득 기준을 함께 봐요.</p><label>최소 집값 (억)<input name="min" type="number" value="24" min="1" step="0.1" required></label><label>최대 집값 (억)<input name="max" type="number" value="36" min="1" step="0.1" required></label><p class="notes">부부 연봉 2.4억 × PIR 10–15배 · 예시</p><div class="dialog-actions"><button type="button" onclick="this.closest('dialog').close()">취소</button><button class="primary">적용</button></div></form></dialog><dialog id="detail"><div id="detail-body"></div><div class="dialog-actions"><button onclick="this.closest('dialog').close()">닫기</button></div></dialog><script>
const data=[['강남구','대치 후보 A',34.8,84,18,900],['강남구','역삼 후보 B',31.2,84,12,640],['강남구','도곡 후보 C',28.6,59,24,1200],['서초구','반포 후보 A',35.5,59,15,1400],['서초구','서초 후보 B',32.4,84,9,720],['서초구','방배 후보 C',29.8,84,20,860],['송파구','잠실 후보 A',33.1,84,18,5600],['송파구','신천 후보 B',30.2,84,16,3000],['송파구','가락 후보 C',27.4,59,8,9500]].map((d,id)=>({id,district:d[0],name:d[1],price:d[2],area:d[3],age:d[4],homes:d[5]}));
let view='a',district='전체',min=24,max=36,focus=0;const selected=new Set(),saved=new Set();const content=document.querySelector('#content');
function card(d){return `<article class="card ${selected.has(d.id)?'selected':''}">${d.id%3===0?'<span class="badge">먼저 살펴볼 후보 · 예시</span>':''}<div class="card-top"><h3>${d.name}</h3><label class="select-label"><input type="checkbox" aria-label="${d.name} 선택" data-id="${d.id}" ${selected.has(d.id)?'checked':''} ${saved.has(d.id)?'disabled':''}></label></div><div class="meta">전용 ${d.area}㎡ · ${d.age}년차 · ${d.homes.toLocaleString()}세대</div><div class="price"><strong>${d.price.toFixed(1)}억</strong><small>추가 자금 <b>${(d.price-21.9).toFixed(1)}억</b></small></div><div class="foot"><button class="link" data-detail="${d.id}">비교 근거 보기 ↗</button><small>${saved.has(d.id)?'담기 완료':selected.has(d.id)?'선택됨':'비교 후보'}</small></div></article>`}
function render(){const list=data.filter(d=>(district==='전체'||d.district===district)&&d.price>=min&&d.price<=max);document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));document.querySelectorAll('[data-district]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.district===district));document.querySelector('#subtitle').textContent={a:'구별로 살펴보고, 마음에 드는 단지는 함께 담아요.',b:'위치부터 고르고, 주변 후보의 가격을 함께 비교해요.',c:'같은 자금으로 비교하고, 추가로 필요한 돈을 확인해요.'}[view];
if(!list.length)content.innerHTML='<div class="empty">조건에 맞는 예시 후보가 없어요. 가격 범위를 넓혀보세요.</div>';
else if(view==='a')content.innerHTML='<div class="groups">'+['강남구','서초구','송파구'].filter(g=>list.some(d=>d.district===g)).map(g=>`<section><div class="group-head"><h2>${g}</h2><small>${list.filter(d=>d.district===g).length}곳</small></div>${list.filter(d=>d.district===g).map(card).join('')}</section>`).join('')+'</div>';
else if(view==='b'){const d=list.find(d=>d.id===focus)||list[0];content.innerHTML=`<div class="map-layout"><div class="map"><svg viewBox="0 0 700 570" preserveAspectRatio="none" aria-hidden="true"><path d="M-20 120 Q210 40 310 155T750 155" fill="none" stroke="var(--down-soft)" stroke-width="65"/><path d="M10 380L650 230M240 170L360 570M520 190L440 560" stroke="var(--background)" stroke-width="18"/><path d="M220 210L280 560M470 220L540 560" stroke="var(--border)" stroke-dasharray="7 8" fill="none"/></svg><span class="map-label">위치 탐색 시안 · 실제 지도가 아닌 구 배치 개념도</span><span class="map-title" style="top:75%;left:10%">서초</span><span class="map-title" style="top:75%;left:45%">강남</span><span class="map-title" style="top:48%;left:80%">송파</span>${list.map(x=>`<button class="pin" data-focus="${x.id}" aria-pressed="${x.id===d.id}" style="left:${({서초구:12,강남구:42,송파구:72})[x.district]+(x.id%3)*3}%;top:${32+(x.id%3)*15}%">${x.price}억</button>`).join('')}</div><section><div class="group-head"><h2>${d.district} · 선택한 위치</h2><small>가상 후보</small></div>${card(d)}<div class="card"><h3>이 후보에서 확인할 것</h3><div class="fact">가격 · 인근 동일 평형과 차이</div><div class="fact">거래 · 최근 6개월 거래량 변화</div><div class="fact">생활 · 통근·학군·역 접근성</div><p class="notes">실제 조사 결과가 들어갈 영역</p></div></section></div>`}
else content.innerHTML=`<div class="table-wrap"><table><thead><tr><th>선택</th><th>구 / 단지</th><th>규모</th><th>예시 집값 ↓</th><th>추가 필요 자금</th><th>소득 대비</th><th></th></tr></thead><tbody>${[...list].sort((a,b)=>b.price-a.price).map(d=>`<tr class="${selected.has(d.id)?'selected':''}"><td><input type="checkbox" data-id="${d.id}" aria-label="${d.name} 선택" ${selected.has(d.id)?'checked':''} ${saved.has(d.id)?'disabled':''}></td><td><small>${d.district}</small><strong>${d.name}</strong></td><td>${d.area}㎡<small>${d.age}년차 · ${d.homes.toLocaleString()}세대</small></td><td><strong>${d.price.toFixed(1)}억</strong></td><td><div class="bar"><i style="width:${(d.price-21.9)*6}px"></i>${(d.price-21.9).toFixed(1)}억</div></td><td>${(d.price/2.4).toFixed(1)}배</td><td><button class="link" data-detail="${d.id}">근거 ↗</button></td></tr>`).join('')}</tbody></table></div>`;
document.querySelector('.dock').hidden=!selected.size;document.querySelector('#count').textContent=`${selected.size}개 선택`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render()}if(b.dataset.district){district=b.dataset.district;render()}if(b.dataset.focus){focus=Number(b.dataset.focus);render()}if(b.dataset.detail){const d=data[Number(b.dataset.detail)];document.querySelector('#detail-body').innerHTML=`<span class="badge">근거 화면 예시</span><h2>${d.name}</h2><p>${d.price}억 · 추가 필요 ${(d.price-21.9).toFixed(1)}억</p><div class="fact"><strong>상대 가격</strong><p>동일 면적·연식의 인근 단지와 가격 차이를 비교합니다.</p></div><div class="fact"><strong>거래 흐름</strong><p>월별 실거래와 거래량을 함께 확인합니다.</p></div><div class="fact"><strong>장점 · 주의점</strong><p>출처가 확인된 입지·생활 조건을 각각 3가지로 정리합니다.</p></div><p class="notes">아직 조사한 결과가 아닌 화면 구성 예시입니다.</p>`;document.querySelector('#detail').showModal()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-id]')){const id=Number(e.target.dataset.id);e.target.checked?selected.add(id):selected.delete(id);render()}});
document.querySelector('#conditions').onclick=()=>document.querySelector('#settings').showModal();document.querySelector('#settings form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(+f.get('max')<+f.get('min')){e.target.elements.max.setCustomValidity('최대 금액은 최소 금액 이상이어야 해요.');e.target.reportValidity();return}min=+f.get('min');max=+f.get('max');document.querySelector('#range').textContent=`${min}–${max}억`;document.querySelector('#settings').close();render()};document.querySelector('[name=max]').oninput=e=>e.target.setCustomValidity('');
document.querySelector('#refresh').onclick=async e=>{const b=e.target;b.disabled=true;b.textContent='후보 조사 중…';document.querySelector('#notice').textContent='예시 동작입니다. 기존 후보는 계속 선택할 수 있어요.';await new Promise(r=>setTimeout(r,1000));b.disabled=false;b.textContent='새 후보 조사';document.querySelector('#notice').textContent='예시 후보 9곳 준비 완료 · 실제 API를 호출하지 않았어요.'};
document.querySelector('#add').onclick=()=>{const n=selected.size;selected.forEach(id=>saved.add(id));selected.clear();document.querySelector('#notice').textContent=`${n}개를 담았어요. 시안에서만 반영되며 실제 관심 목록은 바뀌지 않아요.`;render()};render();
</script></html>

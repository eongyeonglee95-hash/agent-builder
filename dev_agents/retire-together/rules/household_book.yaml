# 가계부 분류 — 사용자 결정 2026-11-20 (docs/DECISIONS.md)
# 월 합계로 적는다(건별 기록 아님). 수입은 사람별, 지출은 가구 합계.
# 쓴 돈 = 고정비 + 생활비 + 큰 지출. 모은 돈 = 연금 납입 + 대출 원금 + 현금 주머니(남은 돈).
# id는 저장 키라 바꾸지 않는다. label은 화면 이름이라 바꿔도 된다.
spend:
  fixed:
    label: 고정비
    items:
      - {id: maintenance, label: 관리비}
      - {id: insurance, label: 보험}
      - {id: telecom, label: 통신}
      - {id: loan_interest, label: 대출이자}
      - {id: fixed_other, label: 기타 고정}
  life:
    label: 생활비
    items:
      - {id: groceries, label: 식비·장보기}
      - {id: dining, label: 외식·카페}
      - {id: transport, label: 교통·차량}
      - {id: shopping, label: 쇼핑·생활용품}
      - {id: health, label: 병원·약}
      - {id: gifts, label: 경조사·선물}
      - {id: life_other, label: 기타 생활}
# 큰 지출은 이름과 금액을 그달마다 직접 적는다(여행·수리·명절 등).
big_label: 큰 지출
saving:
  - {id: pension, label: 연금 납입}
  - {id: principal, label: 대출 원금}
# 지출 항목이 올해 월평균보다 이 비율 넘게 많으면 표시한다.
over_average_ratio: 0.15
# 캡처 자동 분류 — 가맹점 이름에 이 낱말이 들어 있으면 그 항목으로. 사용자가 고른 분류(달 기록의 learned)가 늘 먼저다.
# skip: 가계부에 넣지 않는 것(카드대금·적금 이체 등). 모르는 건 비워 두고 사용자에게 묻는다.
merchant_rules:
  groceries: [이마트, 홈플러스, 롯데마트, 코스트코, 트레이더스, 노브랜드, 하나로마트, 컬리, 마켓컬리, GS더프레시, 롯데슈퍼, 정육, 반찬, 과일]
  dining: [스타벅스, 투썸, 이디야, 메가커피, 메가MGC, 빽다방, 컴포즈, 폴바셋, 블루보틀, 카페, 커피, 배달의민족, 배민, 요기요, 쿠팡이츠, 맥도날드, 버거킹, 롯데리아, 파리바게뜨, 뚜레쥬르, 베이커리, 치킨, 피자, 식당]
  transport: [주유, 칼텍스, SK에너지, S-OIL, 에쓰오일, 현대오일뱅크, 알뜰주유, 하이패스, 도로공사, 카카오T, 택시, 티머니, 코레일, KTX, SRT, 주차]
  shopping: [쿠팡, 다이소, 무신사, 올리브영, 11번가, G마켓, 지마켓, 옥션, SSG, 이케아, 오늘의집, 유니클로]
  health: [의원, 병원, 약국, 치과, 한의원, 안과, 피부과, 정형외과, 내과, 소아과]
  telecom: [SKT, KT, LGU, LG유플러스, 알뜰폰]
  insurance: [보험, 화재, 생명]
  maintenance: [관리비, 아파트]
  gifts: [꽃, 축의, 부의, 선물]
  skip: [카드대금, 카드결제, 적금, 청약]
# 명세서 파일(카드사·은행 엑셀·CSV) 머리글 — 앞의 것이 우선. 띄어쓰기·괄호는 무시하고 맞춘다.
statement_columns:
  date: [이용일자, 이용일, 이용일시, 거래일자, 거래일, 거래일시, 승인일자, 승인일, 승인일시, 매출일자, 매출일, 거래날짜, 날짜, 일자]
  merchant: [가맹점명, 이용가맹점, 가맹점, 이용하신곳, 이용처, 사용처, 거래처, 거래내용, 기재내용, 적요, 내용, 받는분, 메모]
  amount: [이용금액, 승인금액, 결제금액, 거래금액, 출금액, 출금금액, 찾으신금액, 출금, 금액]
  deposit: [입금액, 입금금액, 맡기신금액, 입금]
  status: [취소여부, 취소구분, 승인구분, 거래구분, 입출금구분, 상태, 구분]
# 상태 칸이나 가맹점 이름에 이 낱말이 있으면 가계부에서 뺀다(취소·환불·입금).
statement_skip_words: [취소, 환불, 반품, 입금]

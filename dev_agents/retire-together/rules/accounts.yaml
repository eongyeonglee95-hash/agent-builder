# 계좌 목록 — 워크플로우 0단계 (docs/AGENT_DESIGN.md §1). 설정 화면에서 저장하면 이 파일이 다시 쓰인다.
# owner: me | spouse · broker: mirae | kiwoom | kis · account_type: pension_savings | irp | isa | general
# pocket: pension | cash · layer: 1 국민연금 2 퇴직연금 3 개인연금 4 ISA (현금 주머니는 null)
# pool: 리밸런싱 단위. 같은 pool = 합산, 계좌 하나만 = 계좌별. pools: 풀마다 strategy(전략)와 mode(rebalance | buy_only)
accounts:
  - id: me_mirae_pension_new
    label: 연금저축계좌(신)
    pool: me_pension_new
    owner: me
    broker: mirae
    account_type: pension_savings
    pocket: pension
    layer: 3
    api: false              # 미래에셋 연금계좌 API 없음 → 수동 주문
    active: true            # PoC 대상. 2026-10-26 캡처 기준 평가금액 23,501,048원, 종목 5개
  - id: me_mirae_pension_old
    label: 연금저축계좌(구)
    pool: me_pension_old
    owner: me
    broker: mirae
    account_type: pension_savings
    pocket: pension
    layer: 3
    api: false
    active: true            # PoC 대상. 2026-10-26 캡처 기준 평가금액 39,011,874원, 종목 6개
  - id: me_irp
    pool: me_irp
    owner: me
    broker: mirae           # 미확인, 가정 (docs/DECISIONS.md)
    account_type: irp
    pocket: pension
    layer: 2
    api: false
    active: false           # 회의 후 추가
  - id: me_kiwoom_general
    label: 키움 주식계좌
    owner: me
    broker: kiwoom
    account_type: general
    pocket: cash
    layer: null
    api: true               # 자동 갱신 태그 — 화면을 열 때 키움 REST API(로컬 .env 키)로 잔고·예수금 갱신 (2026-11-16 사용자)
    active: true
  - id: me_kis_pension
    owner: me
    broker: kis
    account_type: pension_savings
    pocket: pension
    layer: 3
    api: true               # 2027년 개설 예정, 자동주문(2단계) 대상
    active: false
  - id: me_mirae_pension_savings
    label: ㅇㅇㅇㅇㅇ
    owner: me
    broker: mirae
    account_type: pension_savings
    pocket: pension
    layer: 3
    api: false
    active: true

# 리밸런싱 풀 — 풀마다 전략 하나 + 모드 하나. 계좌를 묶으면 합산, 하나면 계좌별 (2026-10-26 사용자: 계좌별로 따로)
# mode: rebalance = 매도·매수로 목표 비율 맞춤 / buy_only = 매도 없이 납입금으로만 부족한 자산군 매수 (기계적 적립)
# (구)=리밸런싱, (신)=매수만 — 2026-10-26 사용자 확정. 화면(설정)에서 바꿀 수 있다
pools:
  me_pension_old:
    label: 연금저축(구) — 리밸런싱
    strategy: all_weather
    mode: rebalance
  me_pension_new:
    label: 연금저축(신) — 매수만
    strategy: park_gomhee
    mode: rebalance
  me_irp:
    label: 내 IRP
    strategy: all_weather
    mode: rebalance

# 관심 단지 추적 설정 — 사용자 결정 2026-11-07 (docs/DECISIONS.md)
# large_area_m2: 전용면적이 이보다 큰 거래는 기준값(평형별 중간값·최근 거래) 계산에서 뺀다. 거래 자체는 남겨 둔다.
#   135㎡ = 주택 통계의 대형 경계(전용 135㎡ 초과). Claude 기본값, 사용자 변경 가능.
large_area_m2: 135
# months: 실거래를 볼 기간(개월)
months: 12

# 공개 매매·전월세 호가: 마지막 성공 조회부터 7일 동안 재사용
listing_cache_days: 7

# 사용자 지정 PIR 탐색 범위 기본값 (적정 가격 판정 아님)
pir_min: 10
pir_max: 15

# AI 탐색: 강남·서초, 통상 20·30평형에 대응하는 전용면적 범위
discovery:
  analysis_cache_days: 7
  districts:
    "11680": 강남구
    "11650": 서초구
    "11710": 송파구
  months: 12
  area_min: 50
  area_max: 90
  limit: 9
  per_district: 3
  ranking: price_high  # 자금 근접 순이 아니라 더 높은 가격대까지 탐색
  peer_years: 5
  peer_min: 3
  spotlight_min_trades: 3

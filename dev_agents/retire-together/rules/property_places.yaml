# 관심 단지 생활 입지 설정 — 사용자 요청 2026-11-07(백화점·공원·병원). 공식은 docs/CALCULATION_RULES.md §6-P
# 거리는 모두 직선거리(m). 실제 도보 경로가 아니다.
# radius_m: '반경 안 공원 수'를 셀 거리. Claude 기본값, 사용자 변경 가능
radius_m: 1000
# park_min_area_m2: 이 면적 이상만 '큰 공원'으로 본다(오픈스트리트맵 공원 경계로 계산한 면적). Claude 기본값, 사용자 변경 가능
park_min_area_m2: 100000
# department_stores: 백화점 목록(이름·도로명주소). 위치는 브이월드로 좌표 변환하고 장소 검색 결과와 대조한다.
#   장소 검색은 매장 안 브랜드·출입구가 섞이고 업종이 '대형마트'로 나와 목록 방식을 쓴다. 관심 지역이 늘면 여기에 더한다.
department_stores:
  - {name: 롯데백화점 잠실점, address: 서울특별시 송파구 올림픽로 240}
  - {name: 롯데백화점 강남점, address: 서울특별시 강남구 도곡로 401}
  - {name: 현대백화점 무역센터점, address: 서울특별시 강남구 테헤란로 517}
  - {name: 현대백화점 압구정본점, address: 서울특별시 강남구 압구정로 165}
  - {name: 갤러리아 명품관, address: 서울특별시 강남구 압구정로 343}
  - {name: 신세계백화점 강남점, address: 서울특별시 서초구 신반포로 176}
  - {name: 현대백화점 천호점, address: 서울특별시 강동구 천호대로 1005}

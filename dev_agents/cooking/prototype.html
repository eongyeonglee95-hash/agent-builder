<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 식탁 프로토타입</title>
<style>
  /* LIFEPLUS 폰트 — fonts/는 git에 올리지 않음(라이선스). 파일이 없으면 아래 시스템 폰트로 대체 */
  @font-face { font-family: "LIFEPLUS"; src: url("fonts/LIFEPLUS-Light.ttf") format("truetype"); font-weight: 100 300; font-display: swap; }
  @font-face { font-family: "LIFEPLUS"; src: url("fonts/LIFEPLUS-Medium.ttf") format("truetype"); font-weight: 400 600; font-display: swap; }
  @font-face { font-family: "LIFEPLUS"; src: url("fonts/LIFEPLUS-Bold.ttf") format("truetype"); font-weight: 700 900; font-display: swap; }
  :root {
    --ink: #111;
    --ink-2: #555;
    --ink-3: #8a8a8a;
    --line: #e6e6e6;
    --soft: #f4f4f4;
    --paper: #fff;
    --bg: #ececec;
    --accent: #f5c518;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "LIFEPLUS", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- page shell ---------- */
  .page { max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .page-head h1 { font-size: 22px; letter-spacing: -0.02em; }
  .page-head p { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
  .brand { font-weight: 800; letter-spacing: 0.18em; font-size: 15px; }
  .brand span { font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-left: 8px; }

  .concepts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .concept { padding: 10px 16px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .concept.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .stage { display: grid; grid-template-columns: 390px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 860px) { .stage { grid-template-columns: 1fr; justify-items: center; } }

  /* ---------- phone ---------- */
  .phone {
    width: 100%; max-width: 390px; height: 800px;
    background: #111; border-radius: 52px; padding: 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,.18);
  }
  .screen { position: relative; height: 100%; background: var(--paper); border-radius: 42px; overflow: hidden; display: flex; flex-direction: column; }
  .status { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 6px; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .status i { width: 110px; height: 30px; background: #111; border-radius: 20px; }
  .status b { font-size: 11px; letter-spacing: 2px; }
  .appbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; flex-shrink: 0; }
  .appbar .logo { font-weight: 800; letter-spacing: .14em; font-size: 15px; }
  .appbar .logo small { font-weight: 500; letter-spacing: 0; font-size: 13px; margin-left: 8px; }
  .appbar .title { font-weight: 700; font-size: 17px; }
  .icons { display: flex; gap: 14px; font-size: 18px; }
  .body { flex: 1; overflow-y: auto; padding: 6px 20px 20px; scrollbar-width: none; }
  .body::-webkit-scrollbar { display: none; }
  .foot { padding: 12px 20px 26px; flex-shrink: 0; display: flex; gap: 8px; }

  h2 { font-size: 22px; line-height: 1.32; letter-spacing: -0.02em; }
  .sub { color: var(--ink-2); font-size: 13.5px; line-height: 1.5; margin-top: 6px; }
  .label { font-size: 14px; font-weight: 700; margin: 20px 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .label a { font-weight: 500; color: var(--ink-3); font-size: 12px; cursor: pointer; }

  .btn { flex: 1; height: 50px; border-radius: 12px; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.ghost { border: 1px solid var(--line); }
  .btn:disabled { opacity: .35; cursor: default; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--soft); font-size: 13px; font-weight: 600; }
  .chip.on { background: var(--ink); color: #fff; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--soft); font-size: 11px; color: var(--ink-2); }
  .tag.dark { background: var(--ink); color: #fff; }

  /* expert cards */
  .expert { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--radius); background: var(--soft); margin-bottom: 10px; text-align: left; width: 100%; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 30px; background: #ddd; }
  .avatar.sm { width: 44px; height: 44px; font-size: 22px; }
  .expert h3 { font-size: 17px; }
  .expert .role { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .expert p { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .check { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #bbb; display: grid; place-items: center; font-size: 13px; background: #fff; }
  .check.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .follow { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ink); font-size: 12px; font-weight: 700; background: #fff; }
  .follow.on { background: var(--ink); color: #fff; }

  /* recipe visuals (photo placeholders) */
  .shot { position: relative; border-radius: var(--radius); overflow: hidden; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; min-height: 170px;
          background: radial-gradient(circle at 70% 40%, #6b6b6b 0, #2a2a2a 55%, #151515 100%); }
  .shot .dish { position: absolute; right: 14px; top: 18px; font-size: 64px; filter: grayscale(.4); }
  .shot .from { position: absolute; left: 12px; top: 12px; background: #fff; color: var(--ink); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .shot .ex { position: absolute; right: 12px; top: 12px; font-size: 10px; background: rgba(255,255,255,.2); padding: 3px 8px; border-radius: 999px; }
  .shot h4 { font-size: 21px; line-height: 1.25; position: relative; }
  .shot small { font-size: 12px; opacity: .8; margin-top: 4px; position: relative; }
  .card-actions { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .card-actions button { flex: 1; padding: 12px 0; font-size: 13px; font-weight: 600; }
  .card-actions button.on { color: var(--ink); }
  .card-desc { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; margin: 8px 2px 4px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .taste { position: relative; text-align: left; padding: 14px; border-radius: var(--radius); border: 1px solid var(--line); min-height: 112px; }
  .taste .ico { font-size: 26px; }
  .taste b { display: block; font-size: 15px; margin-top: 8px; }
  .taste span { font-size: 12px; color: var(--ink-2); }
  .taste.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .taste.on span { color: #bbb; }
  .taste .check { top: 10px; right: 10px; }

  .seg { display: flex; background: var(--soft); border-radius: 999px; padding: 3px; }
  .seg button { flex: 1; padding: 9px 0; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .seg button.on { background: var(--ink); color: #fff; }

  .steps { display: flex; gap: 4px; margin-bottom: 10px; }
  .steps i { width: 32px; height: 3px; background: var(--line); border-radius: 2px; }
  .steps i.on { background: var(--ink); }

  .mini { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-align: left; }
  .mini .ph { height: 110px; display: grid; place-items: center; font-size: 46px; background: radial-gradient(circle, #777 0, #2b2b2b 80%); position: relative; }
  .mini .ph .bm { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.9); font-size: 13px; display: grid; place-items: center; }
  .mini .ph .bm.on { background: var(--accent); }
  .mini .ph .sel { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; display: grid; place-items: center; font-size: 12px; color: #fff; }
  .mini .ph .sel.on { background: var(--ink); }
  .mini .tx { padding: 10px 12px 12px; }
  .mini b { font-size: 14px; }
  .mini p { font-size: 11.5px; color: var(--ink-2); margin: 3px 0 8px; line-height: 1.4; }
  .meta { display: flex; gap: 10px; font-size: 11px; color: var(--ink-3); }

  .bubble { display: flex; gap: 12px; align-items: center; background: var(--soft); border-radius: var(--radius); padding: 14px; margin-top: 16px; }
  .bubble p { font-size: 14px; font-weight: 600; line-height: 1.4; }

  /* week + events */
  .week { display: flex; justify-content: space-between; margin: 14px 0; }
  .day { width: 42px; text-align: center; padding: 6px 0; border-radius: 12px; font-size: 12px; color: var(--ink-2); }
  .day b { display: block; font-size: 16px; color: var(--ink); margin-top: 4px; }
  .day.on { background: var(--ink); color: #ddd; }
  .day.on b { color: #fff; }
  .day.today { outline: 1.5px solid var(--line); }
  .event { background: var(--soft); border-radius: var(--radius); padding: 16px; display: flex; justify-content: space-between; gap: 10px; }
  .event .when { font-size: 12px; color: var(--ink-2); }
  .event h3 { font-size: 18px; margin: 8px 0 6px; }
  .event .who { font-size: 12px; color: var(--ink-2); }
  .event .ph { width: 92px; border-radius: 10px; background: radial-gradient(circle, #888, #333); display: grid; place-items: center; font-size: 34px; flex-shrink: 0; }

  .tabs { display: flex; border-bottom: 1px solid var(--line); margin: 0 -20px 8px; }
  .tabs button { flex: 1; padding: 12px 0; font-size: 14px; color: var(--ink-3); font-weight: 600; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--ink); border-color: var(--ink); }

  .timeline { position: relative; margin-top: 6px; }
  .tl { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; position: relative; width: 100%; text-align: left; }
  .tl:not(:last-child)::after { content: ""; position: absolute; left: 13px; top: 40px; bottom: -10px; border-left: 1.5px dashed #ccc; }
  .tl .dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #bbb; display: grid; place-items: center; flex-shrink: 0; font-size: 13px; background: #fff; }
  .tl .dot.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tl time { font-size: 12px; color: var(--ink-2); width: 76px; flex-shrink: 0; padding-top: 5px; }
  .tl b { font-size: 14px; display: block; padding-top: 4px; }
  .tl span { font-size: 12px; color: var(--ink-2); }

  .toggle { width: 44px; height: 26px; border-radius: 999px; background: #ccc; position: relative; transition: .2s; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
  .toggle.on { background: var(--ink); }
  .toggle.on::after { left: 21px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); font-size: 13px; }

  .tabbar { display: flex; border-top: 1px solid var(--line); padding: 8px 6px 22px; flex-shrink: 0; }
  .tabbar div { flex: 1; text-align: center; font-size: 10px; color: var(--ink-3); }
  .tabbar div i { display: block; font-style: normal; font-size: 18px; margin-bottom: 2px; }
  .tabbar div.on { color: var(--ink); font-weight: 700; }

  /* sheet */
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; z-index: 5; }
  .sheet { background: #fff; width: 100%; border-radius: 26px 26px 0 0; padding: 10px 20px 26px; max-height: 82%; overflow-y: auto; }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: #ddd; margin: 0 auto 14px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .sheet-head small { color: var(--ink-2); font-size: 12px; }
  .sheet-head h2 { font-size: 20px; margin-top: 4px; }
  .x { font-size: 20px; color: var(--ink-2); }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; width: 100%; text-align: left; }
  .opt .box { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid #bbb; display: grid; place-items: center; font-size: 12px; flex-shrink: 0; }
  .opt .box.round { border-radius: 50%; }
  .opt .box.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .opt b { font-size: 14px; display: block; }
  .opt span { font-size: 12px; color: var(--ink-2); }

  .toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; white-space: nowrap; z-index: 9; animation: pop .25s ease; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } }

  /* side panel */
  .side { display: grid; gap: 16px; width: 100%; }
  .panel { background: var(--paper); border-radius: 18px; padding: 18px; }
  .panel h3 { font-size: 15px; margin-bottom: 4px; }
  .panel > p { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .flow { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .flow button { padding: 8px 12px; border-radius: 10px; background: var(--soft); font-size: 12.5px; font-weight: 600; }
  .flow button.on { background: var(--ink); color: #fff; }
  .plan-list { list-style: none; margin-top: 10px; display: grid; gap: 8px; }
  .plan-list li { display: flex; justify-content: space-between; gap: 8px; padding: 10px 12px; background: var(--soft); border-radius: 10px; font-size: 13px; }
  .plan-list li span { color: var(--ink-2); font-size: 12px; }
  .empty { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; }
  pre { margin-top: 10px; background: #161616; color: #e6e6e6; border-radius: 10px; padding: 12px; font-size: 11.5px; line-height: 1.5; overflow: auto; max-height: 260px; }
  .note { font-size: 11.5px; color: var(--ink-3); text-align: center; margin-top: 14px; }
</style>
</head>

<div class="page">

    </div>

      </div>
    </div>
  </div>
  <p class="note">기획 시안 · 전문가 예시 / 제휴 미정 · 콘텐츠 예시</p>
</div>

function weekOf(d) {
  const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return [...Array(7)].map((_, i) => { const x = new Date(mon); x.setDate(mon.getDate() + i); return x; });
}

    <button class="opt" data-act="shopping"><span class="box ${S.sheet.shopping ? "on" : ""}">${S.sheet.shopping ? "✓" : ""}</span><div><b>장보기 일정 함께 담기</b><span>필요한 재료를 자동으로 정리해요.</span></div></button>
    <div style="font-size:12px;color:var(--ink-2);margin:10px 0 2px">캘린더에 저장할 일정 ⓘ</div>
    ${[["me", "나만 보기", "내 캘린더에만 저장돼요."], ["family", "가족 공유", "가족과 함께 볼 수 있어요."]].map(([k, t, d]) => `
      <button class="opt" data-act="share" data-v="${k}"><span class="box round ${S.sheet.share === k ? "on" : ""}">${S.sheet.share === k ? "●" : ""}</span><div><b>${t}</b><span>${d}</span></div></button>`).join("")}
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:4px 0 12px"><span class="tag">선택한 준비만 캘린더에 담아요.</span>${duck(56)}</div>
    <button class="btn primary" style="width:100%" data-act="add-plan" ${S.sheet.day ? "" : "disabled"}>식사 계획에 담기</button>
  </div></div>`;
}

/* ---------------- render ---------------- */
const SCREENS = { A: [A0, A1], B: [B0, B1, B2], C: [C0, C1, C2] };

function render() {
  const c = CONCEPTS[S.concept];
  $("#concepts").innerHTML = Object.entries(CONCEPTS).map(([k, v]) => `<button class="concept ${S.concept === k ? "on" : ""}" data-act="concept" data-v="${k}">${v.title}</button>`).join("");
  $("#concept-title").textContent = c.title;
  $("#concept-desc").textContent = c.desc;
  const screenIdx = S.concept === "A" && S.sheet ? 2 : S.screen;
  $("#flow").innerHTML = c.screens.map((t, i) => `<button class="${screenIdx === i ? "on" : ""}" data-act="jump" data-v="${i}">${i + 1}. ${t}</button>`).join("");

  const scroll = $("#screen .body")?.scrollTop || 0;
  const fn = SCREENS[S.concept][Math.min(S.screen, SCREENS[S.concept].length - 1)];
  $("#screen").innerHTML = fn() + sheet() + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : "");
  const body = $("#screen .body"); if (body && S.keepScroll) body.scrollTop = scroll;
  S.keepScroll = false;

  $("#plan").innerHTML = S.plan.length
    ? S.plan.map((p) => `<li><div>${esc(p.title)}<br><span>${esc(p.detail)}</span></div><span>${esc(p.when)}</span></li>`).join("")
    : "";
  if (!S.plan.length) $("#plan").outerHTML = `<ul class="plan-list" id="plan"></ul>`;
  $("#plan").insertAdjacentHTML("afterend", "");
  $("#plan").parentElement.querySelector(".empty")?.remove();
  if (!S.plan.length) $("#plan").insertAdjacentHTML("afterend", `<p class="empty">아직 담은 계획이 없어요.</p>`);

  $("#agent-input").textContent = JSON.stringify(agentInput(), null, 2);
}

function agentInput() {
  const base = { today: iso(TODAY), following: [...S.following].map((id) => expert(id).name) };
  if (S.concept === "A") return { ...base, mode: "expert_subscription", saved_collections: [...S.saved] };
  if (S.concept === "B") return { ...base, mode: "taste_discovery", tastes: [...S.tastes].map((id) => TASTES.find((t) => t.id === id).name), cooking_time: S.time, bookmarked: [...S.bookmarks] };
  return { ...base, mode: "family_schedule", event: FAMILY_EVENT, course: S.cTab, picked_recipes: [...S.picked], preparer: S.who, share_with_family: S.familyShare };
}

let toastTimer;
function toast(msg) {
  S.toast = msg; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; S.keepScroll = true; render(); }, 1800);
}
const toggle = (set, v) => (set.has(v) ? set.delete(v) : set.add(v));

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "close-sheet" && ev.target.closest("[data-stop]") && !ev.target.closest(".x")) return;
  const v = el.dataset.v;
  S.keepScroll = true;
  switch (el.dataset.act) {
    case "concept": S.concept = v; S.screen = 0; S.sheet = null; S.keepScroll = false; break;
    case "jump":
      S.keepScroll = false;
      if (S.concept === "A" && v === "2") { S.screen = 1; openSheet(COLLECTIONS.find((c) => S.following.has(c.expert)) || COLLECTIONS[0]); }
      else { S.screen = +v; S.sheet = null; }
      break;
    case "go": S.screen = +v; S.keepScroll = false; break;
    case "back": S.screen = Math.max(0, S.screen - 1); S.keepScroll = false; break;
    case "filter": S.filter = v; break;
    case "follow": toggle(S.following, v); break;
    case "save": toggle(S.saved, v); break;
    case "taste": toggle(S.tastes, v); break;
    case "time": S.time = v; break;
    case "bookmark": toggle(S.bookmarks, v); break;
    case "ctab": S.cTab = v; break;
    case "pick": toggle(S.picked, v); break;
    case "step": toggle(S.steps, v); break;
    case "who": S.who = v; break;
    case "fshare": S.familyShare = !S.familyShare; break;
    case "toast": toast(v); break;
    case "sheet":
      if (v === "bookmarks") openSheet({ title: RECIPES.filter((r) => S.bookmarks.has(r.id)).map((r) => r.name).join(", "), label: "찜한 요리" });
      else openSheet(COLLECTIONS.find((c) => c.id === v));
      break;
    case "close-sheet": S.sheet = null; break;
    case "day": S.sheet.day = v; break;
    case "shopping": S.sheet.shopping = !S.sheet.shopping; break;
    case "share": S.sheet.share = v; break;
    case "add-plan": {
      const d = new Date(S.sheet.day);
      S.plan.push({ title: S.sheet.title.replace(/\n/g, " "), detail: `${S.sheet.shopping ? "장보기 포함 · " : ""}${S.sheet.share === "family" ? "가족 공유" : "나만 보기"}`, when: `${md(d)} (${DOW[d.getDay()]})` });
      S.sheet = null; toast("식사 계획에 담았어요");
      break;
    }
    case "addfamily": {
      const names = RECIPES.filter((r) => S.picked.has(r.id)).map((r) => r.name).join(", ");
      S.plan.push({ title: `${FAMILY_EVENT.title} · ${names}`, detail: `${S.who} 준비 · ${S.familyShare ? "가족 공유" : "나만 보기"}${S.steps.has("shop") ? " · 장보기 포함" : ""}`, when: "10.31 (토)" });
      toast("가족 일정에 추가했어요");
      break;
    }
  }
  render();
});

function openSheet(item) {
  const e = item.expert ? expert(item.expert) : null;
  S.sheet = { title: item.title, label: item.label || `저장한 ${e ? e.role : ""} 콘텐츠`, day: null, shopping: true, share: "me" };
}

render();
</script>
</body>
</html>
